function anim(el,frames,opts={}){if(!el?.animate||S.prefs.reduced||matchMedia('(prefers-reduced-motion:reduce)').matches){return Promise.resolve()}const a=el.animate(frames,{duration:380,easing:'cubic-bezier(.2,0,0,1)',fill:'both',...opts});return a.finished.catch(()=>{}).then(()=>a.cancel())}
function goTab(id,direction){if(id===U.tab&&U.page&&!U.details.length&&!U.saver&&!U.quick)return;if(U.saver)stopSaver();if(!TAB.some(t=>t[0]===id))return;closeModal();closeQuick();closeDetails();const old=U.page,oldIndex=TAB.findIndex(t=>t[0]===U.tab),newIndex=TAB.findIndex(t=>t[0]===id);U.tab=id;renderTabs();const node=makePage(id);U.page=node;$('#page-root').append(node);if(old){old.inert=true;const sign=direction||(newIndex>=oldIndex?1:-1);anim(node,[{transform:`translate3d(${sign*48}px,0,0)`,opacity:.2},{transform:'translate3d(0,0,0)',opacity:1}]);anim(old,[{transform:'translate3d(0,0,0)',opacity:1},{transform:`translate3d(${-sign*36}px,0,0)`,opacity:0}],{duration:280}).then(()=>old.remove())}refreshLive();U.lastActivity=Date.now()}
function refreshPage(){if(!U.page)return;const scroll=U.page.querySelector('.widget-strip')?.scrollLeft||0;U.page.innerHTML=pageHTML(U.tab);const strip=U.page.querySelector('.widget-strip');if(strip)strip.scrollLeft=scroll;refreshLive()}
function makePage(id){const n=document.createElement('section');n.className='page '+(id==='today'?'home-page':'');n.dataset.page=id;n.setAttribute('role','tabpanel');n.setAttribute('aria-label',TAB.find(t=>t[0]===id)?.[1]||moment());n.innerHTML=pageHTML(id);return n}
function pageHTML(id){return ({today:homeHTML,home:homeControlHTML,media:mediaHTML,communicate:communicateHTML,discover:discoverHTML,wellness:wellnessHTML}[id]||homeHTML)()}
function detailTitle(id){return ({ytLibrary:'Votre bibliothèque',configuration:'Configurer cet écran',diagnostics:'Diagnostic',capabilities:'Fonctions et services',focus:'Concentration',calendarEvent:'Événement',alerts:'Activité locale',apps:'Applications',stopwatch:'Chronomètre',tasks:'Listes',calculator:'Calculatrice',localAudio:'Audio de l’iPad',night:'Mode nuit',settings:'Paramètres',gallery:'Galerie d’art',display:'Écran',sound:'Son',photos:'Cadre photo',widgets:'Personnaliser les cartes',weather:'Météo',city:'Votre ville',alarms:'Alarmes',alarmEdit:'Configurer une alarme',timers:'Minuteurs',timerNew:'Nouveau minuteur',rooms:'Pièces',lights:'Lumières',climate:'Chauffage',device:'',cameras:'Caméras',speakers:'Enceintes et TV',routines:'Routines',connectivity:'Connectivité',wifi:'Wi-Fi',bluetooth:'Bluetooth',youtube:'YouTube',music:'YouTube Music',musicSearch:'YouTube Music',youtubeSettings:'Configurer YouTube',player:'YouTube',relax:'Sons relaxants',notes:'Notes de la maison',calendar:'Calendrier',contacts:'Contacts du foyer',broadcast:'Annoncer',sleep:'Suivi du sommeil',breathing:'Un moment pour vous',about:'À propos',help:'Utiliser votre écran',accessibility:'Accessibilité',data:'Vos données',profile:'Profil local'}[id]||'Nest Hub')}
function detailContent(id,data){switch(id){case'ytLibrary':return ytLibraryHTML();case'configuration':return configurationHTML();case'diagnostics':return diagnosticsHTML();case'capabilities':return statusPageHTML();case'focus':return focusHTML();case'calendarEvent':return calendarEventHTML(data);case'alerts':return alertsHTML();case'apps':return appsHTML();case'stopwatch':return stopwatchHTML();case'tasks':return tasksHTML();case'calculator':return calculatorHTML();case'localAudio':return localAudioHTML();case'night':return nightHTML();case'settings':return settingsHTML();case'display':return displayHTML();case'sound':return soundHTML();case'photos':return photosHTML();case'gallery':return galleryHTML();case'widgets':return widgetsHTML();case'weather':return weatherHTML();case'city':return cityHTML();case'alarms':return alarmsHTML();case'alarmEdit':return alarmEditHTML(data);case'timers':return timersHTML();case'timerNew':return timerNewHTML();case'rooms':return roomsHTML(data);case'lights':return lightsHTML();case'device':return deviceHTML(data||'salon');case'climate':return deviceHTML('chauffage');case'cameras':return camerasHTML();case'speakers':return speakersHTML();case'routines':return routinesHTML();case'connectivity':return connectivityHTML();case'wifi':return wifiHTML();case'bluetooth':return bluetoothHTML();case'music':return musicHTML();case'musicSearch':return youtubeHTML(true);case'youtube':return youtubeHTML();case'youtubeSettings':return youtubeSettingsHTML();case'player':return playerHTML(data);case'relax':return relaxHTML();case'notes':return notesHTML();case'calendar':return calendarHTML();case'contacts':return contactsHTML();case'broadcast':return broadcastHTML();case'sleep':return sleepHTML();case'breathing':return breathingHTML();case'about':return aboutHTML();case'help':return helpHTML();case'accessibility':return accessibilityHTML();case'data':return dataHTML();case'profile':return profileHTML();default:return '<p>Page indisponible.</p>'}}
function openView(id,data=null){if(U.details.at(-1)?.id===id&&U.details.at(-1)?.data===data&&!U.saver)return;if(!Y7.docked||id==='player')suspendYouTube();stopNodes('test');closeQuick();closeModal();if(U.saver)stopSaver();hideKeyboard();const previous=U.details.at(-1);if(previous)previous.node.inert=true;const n=document.createElement('section');n.className='detail '+(id==='weather'?'weather-detail':'');n.dataset.view=id;n.setAttribute('aria-label',detailTitle(id)||'Commande de l’appareil');n.innerHTML=detailShell(id,data);const item={id,data,node:n};U.details.push(item);$('#detail-root').append(n);$('#topbar').inert=true;U.page&&(U.page.inert=true);anim(n,[{transform:'translate3d(100%,0,0)'},{transform:'translate3d(0,0,0)'}]);afterView(item);refreshLive();if(id==='night')updateNightPreview();U.lastActivity=Date.now()}
function detailShell(id,data){const headAction=id==='gallery'?btn('Afficher','galleryPlay','','play','text-btn'):id==='photos'?btn('Afficher','saver','','photo','text-btn'):id==='widgets'?btn('Réinitialiser','widgetsReset','','','text-btn'):id==='weather'?btn(S.prefs.city,'view','city','', 'pill'):id==='alarms'?btn('Ajouter','view','alarmEdit','plus','text-btn'):id==='timers'?btn('Ajouter','view','timerNew','plus','text-btn'):(id==='youtube'||id==='musicSearch')?round('settings','view','youtubeSettings','Options YouTube'):id==='music'?round('external','musicOfficial','','Ouvrir YouTube Music'):'';return `<header class="detail-head">${round('back','back','','Retour')}<h1>${esc(detailTitle(id))}</h1><div class="head-action">${headAction}</div></header><div class="detail-body">${detailContent(id,data)}</div>`}
function afterView(item){if(item.id==='player')mountYouTube(item);if(item.id==='localAudio')mountLocalAudio();if(item.id==='device'||item.id==='climate')updateDial(item.node);if(['youtube','musicSearch'].includes(item.id)){const input=item.node.querySelector('#yt-query'),slot=item.node.querySelector('#keyboard-slot');if(slot&&slot.parentElement!==item.node)item.node.append(slot);input?.addEventListener('focus',()=>{if(!U.keyboard&&!U.nativeKeyboard)showKeyboard()});input?.addEventListener('click',()=>{if(!U.nativeKeyboard)showKeyboard()});input?.addEventListener('input',ev=>{rememberQuery(ev.target.value);updateSearchHint()});updateSearchHint();if(U.keyboard)showKeyboard()}if(item.id==='weather')updateWeatherDOM();if(item.id==='alarmEdit')updateAlarmDays();if(item.id==='relax'&&$('#relax-duration'))$('#relax-duration').value=String(U.relaxMinutes||0)}
function refreshDetail(){parkLocalAudio();const top=U.details.at(-1);if(!top)return;if(top.id==='player')suspendYouTube();const body=top.node.querySelector('.detail-body'),pos=body.scrollTop;top.node.querySelector(':scope > #keyboard-slot')?.remove();body.innerHTML=detailContent(top.id,top.data);body.scrollTop=pos;afterView(top);refreshLive()}
function closeDetails(){suspendYouTube();parkLocalAudio();hideKeyboard();U.details.forEach(v=>v.node.remove());U.details=[];$('#topbar').inert=false;if(U.page)U.page.inert=false}
function back(){if(U.details.at(-1)?.id==='player'&&Y7.ready&&Y7.state===1){dockYouTube()}else if(!Y7.docked){suspendYouTube()}parkLocalAudio();stopNodes('test');if(U.modal)return closeModal();if(U.quick)return closeQuick();if(U.saver)return stopSaver();hideKeyboard();const top=U.details.pop();if(top){top.node.inert=true;const prev=U.details.at(-1);if(prev){prev.node.inert=false;if(prev.id==='alarms'||prev.id==='timers'||prev.id==='photos'||prev.id==='settings')refreshDetail()}else{$('#topbar').inert=false;if(U.page)U.page.inert=false;refreshPage()}anim(top.node,[{transform:'translate3d(0,0,0)'},{transform:'translate3d(100%,0,0)'}],{duration:320}).then(()=>top.node.remove());return}if(U.tab!=='today')goTab('today',-1);else startSaver()}
function homeHTML(){const a=currentAlarm(),t=currentTimer(),d=S.devices.salon,c=wc(),daily=U.weather?.daily;let cards='';for(const w of S.widgets.filter(w=>w.show&&WIDGETS[w.id])){const cls='widget '+(w.size==='large'?'large ':'')+'card-'+({photos:'photo',light:'light',music:'music',weather:'weather',alarm:'alarm',timer:'timer',calendar:'calendar',notes:'notes',youtube:'youtube',tasks:'tasks',focus:'focus'}[w.id]);let html='',act='view',id=w.id;

if(w.id==='light'){id='device';html=`<div class="widget-body"><div class="row between widget-kicker">${ic('bulb')}${ic('right','s')}</div><div class="value" data-live="lampText">${d.on?'Allumée · '+d.brightness+' %':'Éteinte'}</div><div class="caption bottom">${esc(d.name)}</div><div class="subcaption">${esc(d.room)}</div></div>`}

if(w.id==='timer'){id=t?'timers':'timerNew';html=`<div class="widget-body"><div class="widget-kicker">${ic('timer')}</div><div class="value" data-live="firstTimer">${t?secondsText(timerLeft(t)):'5:00'}</div><div class="caption bottom" data-live="timerCaption">${t?'Minuteur':'Créer un minuteur'}</div><div class="subcaption" data-live="timerSub">${t?(t.status==='paused'?'En pause':esc(t.label)):'Cuisine, pause, révisions…'}</div></div><div class="timer-track"><i data-live="timerProgress" style="--progress:${t?(1-Math.max(0,timerLeft(t))/t.duration)*100:0}%"></i></div>`}
if(w.id==='photos'){act='saver';id='';const p=photoList()[0];html=`${p?`<img class="cover-img" src="${esc(photoSource(p))}" alt="" loading="lazy" onerror="this.style.display='none'">`:''}<div class="photo-shade"></div><div class="widget-body"><div class="caption">Vos beaux moments</div><div class="subcaption">Cadre photo</div></div>`}
if(w.id==='notes'){html=`<div class="widget-body"><div class="widget-kicker">${ic('notes')}Notes</div><div class="note-content">${esc(S.notes[0]?.text||'Une petite note pour la maison ?')}</div><div class="subcaption bottom">${S.notes.length?'Vos notes locales':'Écrire une note'}</div></div>`}

function displayHTML(){return `<h3>Thème</h3><div class="theme-options">${[['light','Clair',''],['dark','Sombre','dark'],['auto','Automatique','']].map(([v,l,c])=>`<button class="theme-choice ${S.prefs.theme===v?'selected':''}" data-action="setTheme" data-id="${v}" aria-pressed="${S.prefs.theme===v}"><div class="theme-swatch ${c}" ${v==='auto'?'style="background:linear-gradient(90deg,#f1f3f4 50%,#303134 50%)"':''}><i></i><i></i><i></i></div>${l}</button>`).join('')}</div>${slider('Luminosité de l’interface','brightness',20,100,'Assombrit uniquement cette page. La luminosité de l’écran se règle dans iPadOS.')}${toggle('Horloge sur 24 heures','Utiliser le format 21:30','clock24','clock')}${setting('Mode nuit','Horloge sur fond noir, intensité et horaires','moon','night')}${toggle('Garder l’écran éveillé','Demande le maintien de l’écran actif lorsque le navigateur le permet','keepAwake','sun')}<p class="demo-note">Le thème automatique suit le réglage clair/sombre du navigateur. Le maintien éveillé dépend de Safari, de la connexion sécurisée et de l’état de l’iPad.</p>`}
function soundHTML(){return `<div class="sound-intro"><div><h2>Sonneries de réveil</h2><p class="muted small mt">Des séquences complètes, intégrées au fichier. Aucune connexion nécessaire.</p></div></div><div class="alarm-sound-grid">${Object.entries(ALARM_ASSETS).map(([id,s])=>`<button class="alarm-sound ${S.prefs.alarmSound===id?'selected':''}" data-action="soundSelect" data-id="${id}" aria-pressed="${S.prefs.alarmSound===id}"><span class="alarm-sound-icon">${ic(id==='classic'?'alarm':'music')}</span><span><strong>${esc(s.label)}</strong><small>${esc(s.description)}</small></span>${ic(S.prefs.alarmSound===id?'check':'play')}</button>`).join('')}</div>${slider('Volume des alarmes et minuteurs','alarmVolume',0,100,'Ce réglage ne remplace pas le volume physique de l’iPad. Commencez par écouter un aperçu.')}${selectRow('Montée progressive du volume','alarmRamp',[[0,'Immédiatement'],[10,'10 secondes'],[20,'20 secondes'],[30,'30 secondes']])}${selectRow('Répéter la sonnerie','alarmLimit',[[0,'Jusqu’à « Arrêter »'],[300,'Pendant 5 minutes'],[600,'Pendant 10 minutes'],[1800,'Pendant 30 minutes']],'Les alarmes restent audibles en mode nuit et en mode Ne pas déranger.')}<div class="row mt">${btn('Écouter · 8 secondes','testSound','','volume','pill primary')}${btn('Arrêter l’aperçu','stopSound','','stop','pill')}</div><div class="mt">${slider('Volume des sons relaxants','volume',0,100,'Pour YouTube, utilisez le volume du lecteur et de l’iPad.')}</div>${toggle('Ne pas déranger','Masque les annonces de la démo, sans couper les alarmes','dnd','dnd')}<p class="notice mt">Pour entendre un réveil, laissez la page ouverte au premier plan et vérifiez le volume de l’iPad. Safari ne garantit pas une sonnerie lorsque la page est suspendue ou l’iPad verrouillé. Gardez une alarme dans l’application Horloge pour un réveil important.</p>`}
function widgetsHTML(){return `${uiPresetsHTML()}<p class="muted small mb">Gardez la disposition Nest Hub ou choisissez vos cartes. Un appui long sur une carte ouvre aussi cet écran.</p><div>${S.widgets.filter(w=>WIDGETS[w.id]).map((w,i)=>{const [t,icon,c]=WIDGETS[w.id];return `<div class="widget-list-row"><span class="widget-thumb" style="background:${c};color:${['music','weather','alarm','photos'].includes(w.id)?'#fff':'#526170'}">${ic(icon)}</span><div class="grow"><div class="title">${t}</div></div><select aria-label="Taille ${esc(t)}" data-widget-size="${w.id}"><option value="small" ${w.size==='small'?'selected':''}>Compacte</option><option value="large" ${w.size==='large'?'selected':''}>Grande</option></select>${round('up','widgetUp',w.id,'Déplacer '+t+' avant')}${round('down','widgetDown',w.id,'Déplacer '+t+' après')}${switchBtn(w.show,'widgetToggle',w.id,'Afficher '+t)}</div>`}).join('')}</div><p class="demo-note">L’accueil conserve ses deux rangées et son défilement horizontal. Vos choix sont mémorisés dans ce navigateur lorsque le stockage est autorisé.</p>`}
function cityHTML(){return `<h2 class="mb">Météo à ${esc(S.prefs.city)}</h2><form id="city-form" class="row mb"><input class="field grow" name="city" id="city-input" type="search" minlength="2" placeholder="Rechercher une ville" autocomplete="off" aria-label="Ville"><button class="pill primary" type="submit">Rechercher</button></form><div id="city-results">${cityResultsHTML()}</div>${selectRow('Unité de température','unit',[['celsius','Degrés Celsius'],['fahrenheit','Degrés Fahrenheit']])}<div class="row mt">${btn('Actualiser','refreshWeather','','refresh','pill')}${btn('Voir les prévisions','view','weather','cloud','pill')}</div><p class="notice mt">La météo et la recherche de ville utilisent Open-Meteo et nécessitent Internet. Aucun compte et aucune clé API ne sont nécessaires.</p><p class="demo-note">La ville est choisie manuellement. Cette page ne demande pas votre géolocalisation précise.</p>`}
function cityResultsHTML(){return U.cityResults.map((p,i)=>`<button class="setting-row" data-action="cityPick" data-id="${i}">${ic('home')}<div class="grow">${esc(p.name)}<div class="secondary">${esc([p.admin1,p.country].filter(Boolean).join(' · '))}</div>${ic('right','s')}</button>`).join('')}
function weatherHTML(){const c=wc(),d=U.weather?.daily;return `<div class="weather-main"><div class="weather-now-number" data-live="temperature">${temp(c?.temperature_2m)}</div><div data-live="weatherIcon">${weatherIcon(c?.weather_code,c?.is_day!==0)}</div><div class="grow"><h2 data-live="weatherLabel">${weatherLabel(c?.weather_code)}</h2><div class="weather-data mt">Ressenti ${temp(c?.apparent_temperature)}<br>${typeof c?.wind_speed_10m==='number'?'Vent '+Math.round(c.wind_speed_10m)+' km/h':'Vent —'} · ${typeof c?.relative_humidity_2m==='number'?'Humidité '+Math.round(c.relative_humidity_2m)+' %':'Humidité —'}<br>Max. ${temp(d?.temperature_2m_max?.[0])} · Min. ${temp(d?.temperature_2m_min?.[0])}</div></div></div><div id="weather-hours">${weatherHoursHTML()}</div><div id="weather-week">${weatherWeekHTML()}</div><div class="weather-source">Données : <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> · ${U.weatherAt?'Mise à jour '+new Date(U.weatherAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'En attente de connexion'}${U.weatherStatus==='error'?' · Connexion impossible, dernières données disponibles':''}</div><div class="row mt">${btn('Changer de ville','view','city','', 'pill')}${btn('Actualiser','refreshWeather','','refresh','pill')}</div>${!c&&U.weatherStatus==='error'?'<p class="small mt">Impossible de joindre la météo. Vérifiez Internet ou ouvrez cette page dans Safari. Aucune température fictive n’est affichée.</p>':''}`}
function weatherHoursHTML(){const h=U.weather?.hourly;if(!h?.time)return `<p class="small">${U.weatherStatus==='loading'?'Chargement des prévisions…':'Les prévisions apparaîtront avec une connexion Internet.'}</p>`;const now=Date.now()/1000;let i=h.time.findIndex(v=>v>=now);if(i<0)i=0;return `<div class="weather-hours">${[0,1,2,3,4,5].map(k=>{const j=i+k;return `<div class="hour-weather"><div>${h.time[j]?new Date(h.time[j]*1000).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'—'}</div><div>${weatherIcon(h.weather_code?.[j],true)}</div><div>${temp(h.temperature_2m?.[j])}</div></div>`}).join('')}</div>`}
function alarmDaysLabel(a){if(!a.days?.length)return 'Une seule fois';if(a.days.length===7)return 'Tous les jours';if([1,2,3,4,5].every(x=>a.days.includes(x))&&a.days.length===5)return 'Du lundi au vendredi';return a.days.map(x=>['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'][x]).join(' · ')}
function nextOccurrence(time,days,after=Date.now()){const [h,m]=time.split(':').map(Number);for(let n=0;n<9;n++){const d=new Date(after);d.setDate(d.getDate()+n);d.setHours(h,m,0,0);if(d.getTime()>after&&(!days.length||days.includes(d.getDay())))return d.getTime()}return after+86400000}
function alarmsHTML(){return `<div class="alarm-list">${S.alarms.map(a=>`<div class="alarm-card ${a.enabled?'':'off'}"><div class="row between"><button data-action="editAlarm" data-id="${a.id}" aria-label="Modifier l’alarme ${esc(a.time)}">${ic('alarm')}</button>${switchBtn(a.enabled,'alarmToggle',a.id,'Activer l’alarme '+a.time)}</div><button style="text-align:left;width:100%" data-action="editAlarm" data-id="${a.id}"><div class="time">${esc(a.time)}</div><div>${esc(a.label||'Alarme')}</div><div class="days">${esc(alarmDaysLabel(a))}</div>${a.sunrise?`<div class="alarm-sunrise-tag">${ic('sun')}Lever du soleil · ${a.sunrise} min</div>`:''}</button></div>`).join('')}<button class="add-tile" data-action="view" data-id="alarmEdit">${ic('plus','l')}Régler une alarme</button></div><div class="row mt">${btn('Minuteurs','view','timers','timer','pill')}${btn('Sonneries','view','sound','volume','pill')}${btn('Chronomètre','view','stopwatch','timer','pill')}</div><p class="demo-note mt">Alarmes de cet iPad, sauvegardées localement. Les sonneries et le lever du soleil nécessitent une page ouverte et active.</p>`}
function alarmEditHTML(id){const a=S.alarms.find(a=>a.id===id)||{id:'',time:'07:00',label:'Réveil',days:[],enabled:true,sunrise:0};return `<form id="alarm-form" data-alarm="${esc(a.id)}"><div class="alarm-editor"><div><label class="field-label" for="alarm-time">Heure du réveil</label><input class="field" type="time" id="alarm-time" name="time" value="${esc(a.time)}" required><label class="field-label" for="alarm-label">Nom</label><input class="field" name="label" id="alarm-label" maxlength="60" value="${esc(a.label)}" placeholder="Réveil"><h3 class="mt" style="font-weight:400">Répéter</h3><div class="week-days">${[1,2,3,4,5,6,0].map(day=>`<button type="button" class="day-button ${a.days.includes(day)?'active':''}" data-action="draftDay" data-id="${day}" aria-pressed="${a.days.includes(day)}" aria-label="${['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'][day]}">${['D','L','M','M','J','V','S'][day]}</button>`).join('')}</div><p id="alarm-repeat-label" class="demo-note">${esc(alarmDaysLabel(a))}</p></div><div><div class="row">${btn('Écouter','alarmPreviewSelected','','volume','pill')}${btn('Sonnerie','view','sound','music','pill')}</div><div class="alarm7-selects"><label>Sonnerie de ce réveil<select name="sound"><option value="default" ${(a.sound||'default')==='default'?'selected':''}>Sonnerie générale</option>${Object.entries(ALARM_ASSETS).map(([k,v])=>`<option value="${k}" ${a.sound===k?'selected':''}>${esc(v.label)}</option>`).join('')}</select></label><label>Répétition après la sonnerie<select name="snoozeMin">${[1,5,10,15].map(v=>`<option value="${v}" ${Number(a.snoozeMin||5)===v?'selected':''}>${v} minute${v>1?'s':''}</option>`).join('')}</select></label></div><div class="sunrise-options"><label for="alarm-sunrise">${ic('sun')} Réveil en douceur</label><select name="sunrise" id="alarm-sunrise">${[[0,'Désactivé'],[5,'5 minutes avant'],[10,'10 minutes avant'],[15,'15 minutes avant'],[30,'30 minutes avant']].map(([v,l])=>`<option value="${v}" ${Number(a.sunrise||0)===v?'selected':''}>${l}</option>`).join('')}</select><p>L’écran prend progressivement les couleurs du lever du soleil avant la sonnerie. Cela ne modifie pas la luminosité système de l’iPad.</p>${btn('Aperçu du lever du soleil','sunrisePreview','','sun','text-btn')}</div><p class="notice">Gardez la page active et vérifiez le volume de l’iPad. Une page web ne remplace pas l’alarme système lorsque l’iPad est verrouillé.</p></div></div><div class="editor-actions row mt"><button class="pill primary" type="submit">Enregistrer</button>${a.id?btn('Supprimer','alarmDelete',a.id,'trash','pill danger'):''}</div></form>`}
function updateAlarmDays(){const days=$$('#alarm-form .day-button.active').map(b=>Number(b.dataset.id));write('#alarm-repeat-label',alarmDaysLabel({days}))}
function timersHTML(){return `<div class="alarm-list">${S.timers.map(t=>`<div class="timer-card" data-timer-card="${t.id}"><div class="row between"><span>${esc(t.label||'Minuteur')}</span>${round('trash','timerDelete',t.id,'Supprimer ce minuteur')}</div><div class="time" data-timer-id="${t.id}">${secondsText(timerLeft(t))}</div><div class="row">${round(t.status==='running'?'pause':'play','timerPause',t.id,t.status==='running'?'Mettre en pause':'Reprendre','filled')}${btn('+ 1 min','timerAdd',t.id,'','pill')}${t.status==='done'?'<span class="small">Terminé</span>':''}</div></div>`).join('')}<button class="add-tile" data-action="view" data-id="timerNew">${ic('plus','l')}Créer un minuteur</button></div><div class="timer-presets">${[1,3,5,10,15,30].map(n=>btn(n+' min','timerPreset',String(n),'timer','pill')).join('')}</div><p class="demo-note">Pause, reprise et décompte sont réels. Les échéances sont sauvegardées. Le son nécessite une page active et l’audio autorisé sur l’iPad.</p>`}
function timerNewHTML(){return `<form id="timer-form"><h2 class="mb">De combien de temps avez-vous besoin ?</h2><div class="timer-inputs"><div><label class="field-label" for="timer-hours">Heures</label><input class="field" type="number" id="timer-hours" name="hours" min="0" max="23" step="1" value="0" required></div><div><label class="field-label" for="timer-minutes">Minutes</label><input class="field" type="number" id="timer-minutes" name="minutes" min="0" max="59" step="1" value="5" required></div><div><label class="field-label" for="timer-seconds">Secondes</label><input class="field" type="number" id="timer-seconds" name="seconds" min="0" max="59" step="1" value="0" required></div></div><div class="timer-name mt"><label class="field-label" for="timer-label">Nom du minuteur</label><input class="field" id="timer-label" name="label" maxlength="60" placeholder="Cuisine, pause, révisions…"></div><div class="timer-presets">${[1,3,5,10,15].map(n=>btn(n+' min','timerFill',String(n),'','pill')).join('')}</div><button type="submit" class="pill primary">${ic('play')}Démarrer</button></form>`}
function lightsHTML(){return `<div class="row between mb"><h2>Éclairage de la maison</h2>${btn('Tout éteindre','lightsOff','','power','pill')}</div><div class="device-grid">${Object.entries(S.devices).filter(([,d])=>d.type==='light').map(([id,d])=>deviceTile(id,d)).join('')}</div><p class="demo-note">Appareils de démonstration : les commandes changent uniquement leur état dans cette interface.</p>`}
function deviceTile(id,d){return `<button class="device-tile ${d.on?'on':''}" data-action="device" data-id="${id}"><div class="row between">${ic(d.type==='light'?'bulb':d.type==='climate'?'thermo':d.type==='media'?'tv':'plug')}${ic('right','s')}</div><div class="device-title">${esc(d.name)}</div><div class="device-state">${esc(d.room)} · ${d.on?(d.type==='light'?d.brightness+' %':d.type==='climate'?d.temp+' °C':'Allumé'):'Éteint'}</div></button>`}
function roomsHTML(room){const rooms=[...new Set(Object.values(S.devices).map(d=>d.room))];return `<div class="pills mb">${btn('Toutes les pièces','room','all','','pill '+(!room||room==='all'?'active':''))}${rooms.map(r=>btn(r,'room',r,'','pill '+(room===r?'active':''))).join('')}</div><div class="device-grid">${Object.entries(S.devices).filter(([,d])=>!room||room==='all'||d.room===room).map(([id,d])=>deviceTile(id,d)).join('')}</div><p class="demo-note">Maison locale de démonstration. Aucun appareil réel n’est connecté.</p>`}
function deviceHTML(id){const d=S.devices[id];if(!d)return '<p>Appareil indisponible.</p>';if(d.type==='light'||d.type==='climate'){return `<div class="dial-screen"><div class="dial-sidebar"><p class="muted small mb">${esc(d.room.toUpperCase())}</p><h2>${esc(d.name)}</h2><div class="setting-row" style="color:var(--blue)">${ic(d.type==='light'?'sun':'thermo')}<span>${d.type==='light'?'Luminosité':'Température'}</span></div>${d.type==='light'?`<button class="setting-row" data-action="deviceColors" data-id="${id}">${ic('routines')}Couleur</button>`:''}<p class="demo-note">Appareil de démonstration</p></div><div class="dial-wrap" data-device-dial="${id}" tabindex="0" role="slider" aria-label="${d.type==='light'?'Luminosité':'Température'}" aria-valuemin="${d.type==='light'?0:10}" aria-valuemax="${d.type==='light'?100:30}" aria-valuenow="${d.type==='light'?d.brightness:d.temp}" style="--dial-color:${d.type==='light'?'#d99b2f':'#e88c52'}"><svg class="dial-svg" viewBox="0 0 356 356" aria-hidden="true"><path class="dial-track"></path><path class="dial-fill"></path><circle class="dial-knob" r="10"></circle></svg><div class="dial-center"><div class="dial-number"><span data-device-value="${id}">${d.type==='light'?(d.on?d.brightness:0):d.temp}</span><span class="dial-unit">${d.type==='light'?'%':'°'}</span></div></div><div class="dial-bottom">${d.type==='climate'?round('minus','deviceStep',id+':-0.5','Diminuer la température'):''}${btn(d.on?'Éteindre':'Allumer','devicePower',id,'','pill')}${d.type==='climate'?round('plus','deviceStep',id+':0.5','Augmenter la température'):''}</div></div></div>`}
return `<div class="dial-screen"><div><p class="muted small mb">${esc(d.room)}</p><h2>${esc(d.name)}</h2><p class="demo-note">Appareil de démonstration</p></div><div class="center" style="text-align:center">${ic(d.type==='media'?'tv':'plug','xl')}<h2 class="mt">${d.on?'Allumé':'Éteint'}</h2><div class="mt">${btn(d.on?'Éteindre':'Allumer','devicePower',id,'power','pill primary')}</div>${d.type==='media'?'<p class="demo-note">La lecture et les appareils Cast restent simulés.</p>':''}</div></div>`}
function camerasHTML(){return `<div class="grid2"><button class="soft-card" style="min-height:235px;text-align:left" data-action="cameraDemo" data-id="Entrée">${ic('camera','l')}<h2 class="mt">Entrée</h2><p class="muted small mt">Caméra de démonstration</p></button><button class="soft-card" style="min-height:235px;text-align:left" data-action="cameraDemo" data-id="Jardin">${ic('camera','l')}<h2 class="mt">Jardin</h2><p class="muted small mt">Caméra de démonstration</p></button></div><p class="demo-note">Aucun flux réel. Aucune caméra de l’iPad n’est utilisée.</p>`}
function speakersHTML(){return `<div class="device-grid">${deviceTile('tv',S.devices.tv)}<button class="device-tile" data-action="speakerDemo" data-id="Salon">${ic('speaker','l')}<div class="device-title">Enceinte du salon</div><div class="device-state">Démo · Disponible</div></button><button class="device-tile" data-action="speakerDemo" data-id="Toute la maison">${ic('speaker','l')}<div class="device-title">Toute la maison</div><div class="device-state">Groupe de démonstration</div></button></div><p class="demo-note">Les vrais sons de la page sortent de l’iPad. Aucun envoi Cast n’est effectué.</p>${setting('Sons de cet iPad','Volume et test de sonnerie','volume','sound')}`}
function routinesHTML(){return `<div class="discover-grid">${[['Bonjour','sun','morning'],['Bonne nuit','moon','night'],['Je pars','room','away'],['Je suis rentré','home','back']].map(([n,i,id])=>`<button class="discover-card" data-action="routine" data-id="${id}">${ic(i)}<h3>${n}</h3><p>Scène de démonstration</p></button>`).join('')}</div><p class="notice mt">Ces routines changent uniquement les lumières et le thermostat fictifs de cette page.</p>`}
function connectivityHTML(){return `${setting('Wi-Fi','La connexion Internet de votre iPad','wifi','wifi')}${setting('Bluetooth','Sortie audio et accessoires iPadOS','bluetooth','bluetooth')}${setting('À propos des appareils','Maison locale de démonstration','info','about')}<p class="demo-note">Un fichier HTML ne configure ni les réseaux Wi-Fi ni les accessoires Bluetooth du système.</p>`}
function wifiHTML(){return `<div class="row mb">${ic('wifi','xl')}<div><h2>${navigator.onLine?'Réseau disponible':'Mode hors ligne'}</h2><p class="muted small mt">État indiqué par le navigateur, pas un test complet d’Internet.</p></div></div><p class="notice mt">Pour choisir le réseau, ouvrez Réglages → Wi-Fi sur l’iPad. La météo et les photographies utilisent ensuite automatiquement cette connexion.</p><p class="muted mt">Cette page ne connaît pas le nom de votre réseau et ne demande aucun mot de passe Wi-Fi.</p>${btn('Tester la météo','refreshWeather','','refresh','pill mt')}`}
function bluetoothHTML(){return `<div class="row mb">${ic('bluetooth','xl')}<h2>Le son sort de votre iPad</h2></div><p class="notice">Pour utiliser une enceinte ou des écouteurs Bluetooth, associez-les dans les Réglages de l’iPad, puis choisissez cette sortie dans son Centre de contrôle.</p><div class="mt">${btn('Tester le son','testSound','','volume','pill primary')}</div><p class="demo-note">Le fichier HTML ne peut ni rechercher ni appairer des enceintes Bluetooth.</p>`}
function notesHTML(){return `<form id="note-form" class="mb"><label for="note-text" class="field-label">Laissez une note à la maison</label><textarea class="field note-area" id="note-text" name="text" maxlength="350" placeholder="Penser au pain, rendez-vous, petit mot…" required></textarea><button type="submit" class="pill primary mt">${ic('plus')}Ajouter</button></form><div class="grid3">${S.notes.map(n=>`<div class="note-tile">${round('close','noteDelete',n.id,'Supprimer la note','remove-note')}<p>${esc(n.text)}</p></div>`).join('')}</div><p class="demo-note">Ces notes sont enregistrées sur cet appareil uniquement.</p>`}
function localDay(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function calendarHTML(){const now=new Date(),view=Y7.month,first=new Date(view.getFullYear(),view.getMonth(),1),count=new Date(view.getFullYear(),view.getMonth()+1,0).getDate(),offset=(first.getDay()+6)%7,selected=Y7.selectedDate;const events=(S.events||[]).filter(e=>e.date===selected).sort((a,b)=>a.time.localeCompare(b.time));return `<div class="calendar7-layout"><div class="calendar7-month"><div class="row between mb">${round('left','calendarMonth','-1','Mois précédent')}<h2>${view.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h2>${round('right','calendarMonth','1','Mois suivant')}</div><div class="calendar7-grid">${['L','M','M','J','V','S','D'].map(d=>'<span class="calendar7-week">'+d+'</span>').join('')}${'<i></i>'.repeat(offset)}${Array.from({length:count},(_,i)=>{const day=localDay(new Date(view.getFullYear(),view.getMonth(),i+1)),has=(S.events||[]).some(e=>e.date===day);return `<button class="calendar7-day ${day===localDay()?'today':''} ${day===selected?'selected':''}" data-action="calendarDay" data-id="${day}" aria-label="${i+1} ${view.toLocaleDateString('fr-FR',{month:'long'})}${has?', événements prévus':''}" aria-pressed="${day===selected}">${i+1}${has?'<i></i>':''}</button>`}).join('')}</div><div class="pills mt">${btn('Aujourd’hui','calendarToday','','calendar','pill')}${btn('Exporter .ics','calendarExport','','download','pill')}</div></div><div class="calendar7-day-detail"><div class="row between"><h3>${new Date(selected+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</h3>${round('plus','calendarNew','','Ajouter un événement','filled')}</div>${events.length?events.map(e=>`<div class="calendar7-event"><button data-action="calendarEdit" data-id="${e.id}"><time>${esc(e.time)}</time><span>${esc(e.title)}</span></button>${round('trash','eventDelete',e.id,'Supprimer '+e.title)}</div>`).join(''):`<div class="calendar7-empty">${ic('calendar','xl')}<p>Rien de prévu pour cette journée.</p></div>`}<div class="mt">${btn('Ajouter un événement','calendarNew','','plus','pill primary')}</div></div></div><p class="demo-note">Agenda enregistré sur cet iPad, sans synchronisation Google ni alertes d’événement. L’export .ics peut être importé dans une application de calendrier.</p>`}
function contactsHTML(){return `${['Contact 1','Contact 2','Toute la maison'].map((n,i)=>`<div class="contact"><span class="avatar">${i<2?i+1:ic('home')}</span><div class="grow"><h3>${n}</h3><p class="small muted">Contact de démonstration</p></div>${round('phone','callDemo',n,'Simuler un appel')}</div>`).join('')}<p class="demo-note">Aucun accès au carnet d’adresses de votre iPad.</p>`}

function breathingHTML(){return `<div style="text-align:center"><h2>Prenez le temps de respirer</h2><div class="breathing-orb"></div><p class="breathing-guide">Suivez doucement le mouvement.</p><p class="muted small mt">Inspirez quand le cercle grandit. Expirez quand il rétrécit.</p>${btn('Sons relaxants','view','relax','music','pill mt')}</div>`}

function youtubeHTML(music=false){const query=music?U.musicQuery:U.search,label=music?'Un titre, un artiste…':'Une vidéo ou un lien YouTube…';return `<form id="youtube-form" class="search-form"><div class="search-bar">${ic('search')}<input id="yt-query" type="text" inputmode="none" readonly name="query" value="${esc(query)}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="${music?'Rechercher une vidéo musicale':'Rechercher sur YouTube'}" placeholder="${label}" maxlength="500" required>${round('close','queryClear','','Effacer')}${round('keyboard','customKeyboard','','Clavier tactile')}<button class="pill primary" type="submit">Rechercher</button></div></form><div class="search-typing-area" aria-hidden="true"><span class="search-typing-hint">Saisissez votre recherche</span></div><div id="yt-content" aria-live="polite">${youtubeResultHTML(music?'music':'youtube')}</div><div id="keyboard-slot" hidden></div>`}
function youtubeResultHTML(kind=ytKind()){
 const r=ytLane(kind),music=kind==='music';
 const controls=`<div class="yt7-topline"><div class="yt7-filter"><label>Trier <select data-yt-filter="order" aria-label="Trier les résultats"><option value="relevance" ${r.order==='relevance'?'selected':''}>Pertinence</option><option value="date" ${r.order==='date'?'selected':''}>Plus récents</option><option value="viewCount" ${r.order==='viewCount'?'selected':''}>Nombre de vues</option></select></label><label>Durée <select data-yt-filter="duration" aria-label="Durée des vidéos">${[['any','Toutes'],['short','Moins de 4 min'],['medium','4 à 20 min'],['long','Plus de 20 min']].map(([v,t])=>`<option value="${v}" ${r.duration===v?'selected':''}>${t}</option>`).join('')}</select></label></div><div class="pills">${btn('Bibliothèque','view','ytLibrary','heart','pill')}${btn('Configurer','view','youtubeSettings','settings','pill')}</div></div>`;
 if(r.loading&&!r.results.length)return controls+`<div class="yt7-skeleton" aria-label="Recherche en cours">${Array.from({length:6},()=>'<i></i>').join('')}</div><p class="small muted">Recherche sur YouTube…</p>`;
 if(r.error)return controls+`<div class="yt7-empty"><div class="yt7-empty-icon">${ic('info')}</div><h2>La recherche n’a pas abouti</h2><p>${esc(r.error)}</p><div class="pills">${btn('Réessayer','ytRetry','','refresh','pill primary')}${btn('Réglages YouTube','view','youtubeSettings','settings','pill')}</div></div>`;
 if(r.query)return controls+`<div class="yt7-result-heading"><span>${r.results.length} résultat${r.results.length>1?'s':''} pour <strong>« ${esc(r.query)} »</strong>${music?' · vidéos musicales YouTube':''}</span>${r.cached?'<span class="muted small">En mémoire</span>':''}</div>${r.results.length?'<div class="yt7-grid">'+r.results.map(ytCardHTML).join('')+'</div>':'<div class="yt7-empty"><h3>Aucune vidéo intégrable trouvée</h3><p>Essayez un autre titre ou une recherche moins précise.</p></div>'}${r.next?'<div class="yt7-more">'+btn(r.loading?'Chargement…':'Plus de résultats','ytMore','','down','pill')+'</div>':''}<p class="demo-note">Résultats fournis par YouTube. Certaines vidéos restent soumises à des restrictions de lecture.</p>`;
 return controls+`<div class="yt7-welcome"><span class="yt7-brand">${music?YTM:ytLogo()}${music?'Vidéos musicales':'YouTube'}</span><h2>${music?'Que voulez-vous écouter ?':'Que voulez-vous regarder ?'}</h2><p class="muted">${music?'Recherchez des clips, des concerts et des vidéos musicales.':'Un documentaire, votre créateur préféré ou simplement une nouvelle idée.'}</p><div class="pills">${(music?['Concert live','Piano','Jazz','Musique relaxante']:['Documentaires','Paysages 4K','Technologie','Cuisine']).map(q=>btn(q,'queryPreset',q,'search','pill')).join('')}</div></div>${S.searches.length?`<h3 class="mb">Recherches récentes</h3><div class="pills">${S.searches.slice(0,6).map(q=>btn(q,'queryPreset',q,'clock','pill')).join('')}</div>`:''}<div class="yt7-connect-note">${ic(U.ytKey?'check':'settings')}<div>${U.ytKey?'Votre clé est prête pour la recherche intégrée.':'Ajoutez votre clé API dans « Configurer » pour afficher les résultats ici.'}<small>Un lien de vidéo peut être ouvert ici sans clé. ${music?'Pour votre bibliothèque YouTube Music personnelle, utilisez le site officiel.':''}</small></div></div>${music?btn('Site officiel YouTube Music','musicOfficial','','external','text-btn'):''}`;
}
function keyboardHTML(){const numeric=U.keyMode==='numbers',rows=numeric?['1234567890','@#€%&-+()/','.,:;!?"\'']:['azertyuiop','qsdfghjklm','wxcvbn'];return `<div class="keyboard" role="group" aria-label="Clavier tactile AZERTY"><div class="keyboard-head"><span>Français · AZERTY</span><button type="button" data-action="nativeKeyboard">Clavier de l’iPad</button><button type="button" data-action="hideKeyboard">Masquer ${ic('down','s')}</button></div>${rows.map((r,i)=>`<div class="key-row">${i===2?`<button class="key wide ${U.shift?'key-active':''}" type="button" data-action="keyShift" aria-label="Majuscules" aria-pressed="${U.shift}">⇧</button>`:''}${Array.from(r).map(c=>`<button type="button" class="key" data-action="key" data-id="${esc(U.shift?c.toUpperCase():c)}">${esc(U.shift?c.toUpperCase():c)}</button>`).join('')}${i===2?'<button class="key wide" type="button" data-action="keyBack" aria-label="Effacer un caractère">⌫</button>':''}</div>`).join('')}<div class="key-row"><button class="key wide" type="button" data-action="keyMode">${numeric?'ABC':'?123'}</button><button class="key" type="button" data-action="key" data-id="é">é</button><button class="key" type="button" data-action="key" data-id="à">à</button><button class="key space" type="button" data-action="key" data-id=" ">espace</button><button class="key wide enter" type="button" data-action="search">${ic('search')}<span>Rechercher</span></button></div></div>`}
function youtubeSettingsHTML(){const origin=['http:','https:'].includes(location.protocol)?location.origin+'/*':'Votre adresse HTTPS est nécessaire pour une restriction de site';const usage=S.final.youtube.usage?.date===localDay()?S.final.youtube.usage.count:0;return `<div class="yt7-settings-intro">${ytLogo()}<div><h2>YouTube dans votre écran</h2><p class="muted">La clé sert à la recherche. Le lecteur est le lecteur officiel YouTube.</p></div></div><form id="yt-key-form"><label for="yt-key" class="field-label">Clé YouTube Data API v3</label><input class="field" type="password" id="yt-key" name="key" autocomplete="new-password" autocapitalize="off" spellcheck="false" placeholder="${U.ytKey?'Clé déjà disponible · laissez vide pour la garder':'Collez votre clé personnelle ici'}"><label class="yt7-checkbox"><input type="checkbox" name="remember" ${Y7.persist?'checked':''}> Mémoriser la clé sur cet iPad</label><p class="small muted">Sinon, elle reste dans cet onglet jusqu’à sa fermeture. Une clé mémorisée n’est pas chiffrée : limitez-la à cette API et à votre domaine.</p><div class="pills mt"><button type="submit" class="pill primary">Enregistrer</button>${btn('Tester la clé','ytTestKey','','check','pill')}${btn('Effacer','ytKeyClear','','trash','pill')}</div></form><p class="yt7-key-status ${Y7.keyStatus?'visible':''}" role="status">${esc(Y7.keyStatus|| (U.ytKey?'Une clé est disponible. Son accès reste à tester.':'Aucune clé enregistrée.'))}</p><div class="settings-section">Accès et confidentialité</div><div class="setting-row"><div class="grow">Mémoriser les vidéos lues ici<div class="secondary">Historique local, indépendant de votre compte YouTube</div></div>${switchBtn(S.final.youtube.rememberHistory,'ytHistoryToggle','','Mémoriser les vidéos lues')}</div><div class="notice mt"><strong>Référent à autoriser dans Google Cloud</strong><code class="yt7-origin">${esc(origin)}</code>Dans les restrictions de la clé : « Sites Web », puis cette adresse. Dans les restrictions d’API : seulement YouTube Data API v3.</div><p class="small muted mt">${usage} appel${usage>1?'s':''} de recherche envoyé${usage>1?'s':''} depuis cet écran aujourd’hui. Ce compteur local n’indique pas le quota total de votre projet. Les résultats sont gardés dix minutes en mémoire pour éviter des requêtes répétées.</p><div class="pills mt">${btn('Ouvrir YouTube','view','youtube','search','pill primary')}${btn('Diagnostic','view','diagnostics','info','pill')}<a class="pill" href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noopener">Google Cloud ${ic('external','s')}</a></div><p class="demo-note">L’API et le lecteur reçoivent des requêtes sur les services Google. La clé n’est jamais incluse dans vos exports de réglages. Pour un site public partagé, utilisez votre propre serveur pour mieux protéger les accès.</p>`}
function playerHTML(v){if(!validVideo(v))return '<p class="notice">Ce lien ne contient pas un identifiant de vidéo YouTube valide.</p>';const mark=ytBookmarked('favorites',v.id);return `<div class="yt7-player-layout"><div id="yt7-stage" class="yt7-stage"><div class="yt7-player-placeholder">${ytLogo()}<p>Préparation du lecteur officiel…</p></div></div><div class="yt7-player-description"><div class="yt7-now"><div class="yt7-now-label">${ytLogo()}<span id="yt7-state">Prêt à lancer la vidéo</span></div><h2>${esc(v.title||'Vidéo YouTube')}</h2><p>${esc(v.channel||'YouTube')}</p></div><div id="yt7-player-actions" class="yt7-player-actions">${ytPlayerTools(v)}</div></div><div id="yt7-message" class="yt7-message" role="status">Touchez le lecteur si Safari vous demande de lancer la vidéo.</div><div class="yt7-player-bottom">${btn('Diagnostic du lecteur','view','diagnostics','info','text-btn')}<a class="text-btn" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">Ouvrir sur YouTube ${ic('external','s')}</a></div></div>`}
function helpHTML(){return `<div class="grid2"><div><h2 class="mb">Comme sur un Nest Hub</h2>${setting('Les onglets en haut','Passez de votre journée à la maison ou aux médias.','apps','settings')}${setting('Balayez depuis le bas','Ouvre les réglages rapides. La petite barre grise est aussi cliquable.','up','settings')}${setting('Balayez depuis le bord gauche','Revenez à l’écran précédent. Le bouton Retour fait la même chose.','back','settings')}${setting('Touchez l’heure','Ouvre le cadre photo. Touchez la photo pour revenir. Un appui long affiche pause, favoris et réglages.','photo','photos')}</div><div><h2 class="mb">Vos options</h2><p class="small">Un <strong>appui long sur une carte</strong> ouvre sa personnalisation. Les grandes cartes se parcourent horizontalement. Tous les curseurs fonctionnent au doigt et à la souris.</p><h3 class="mt mb">Au clavier</h3><p class="small">Échap : retour · H : accueil · S : paramètres · P : cadre photo · F : plein écran · Flèches : onglet suivant/précédent, ou photo suivante/précédente.</p><h3 class="mt mb">Sur l’iPad</h3><p class="small">L’interface utilise toute la surface visible de Safari. Elle conserve les proportions des commandes et adapte les cartes au paysage ou au portrait, notamment sur iPad Air 3. L’aperçu de Fichiers n’exécute pas toujours les pages interactives : une ouverture comme page web dans Safari est la plus fiable.</p><div class="mt">${btn('Plein écran','fullscreen','','fullscreen','pill')}${btn('Réglages rapides','quick','','sliders','pill')}</div></div></div>`}
function aboutHTML(){return `<h2>Nest Hub · Édition finale</h2><p class="muted mt">Version ${VERSION} · Interface de référence, outils locaux et adaptation iPad</p><p class="notice mt">Ce fichier n’est pas un produit Google, une application Google Home ni un firmware Nest. Il reconstitue l’interface classique à onglets du Nest Hub de deuxième génération. Il ne prétend pas reproduire au pixel près toutes les versions du logiciel.</p><div class="grid2 mt"><div><h3 class="mb">Fonctions réelles</h3><p class="small">Horloge, calendrier local, notes, listes, calculatrice, chronomètre, lecteur audio personnel, météo Open-Meteo, réglages sauvegardés, personnalisation des cartes, diaporama, import de photos, minuteurs, alarmes, réveil visuel progressif et sons locaux quand la page reste active. YouTube : recherche avec votre clé, lecteur officiel, filtres, favoris et historique locaux. Agenda exportable et mode concentration. Les API réelles nécessitent Internet et les autorisations du service.</p></div><div><h3 class="mb">Fonctions simulées</h3><p class="small">Appareils Google Home, éclairage, chauffage, enceintes, caméras, routines, appels, assistant et données de sommeil. Aucun microphone n’est demandé, aucun compte Google Home n’est connecté.</p></div></div><h3 class="mt mb">Typographie et audio</h3><p class="small">Google Sans : <span id="font-status">${fontStatus()}</span>. Police de secours utilisée hors ligne si nécessaire. Trois sonneries originales intégrées, produites par synthèse instrumentale ; ce ne sont pas les sons propriétaires du Nest Hub.</p><h3 class="mt mb">Références visuelles et techniques</h3><p class="small"><a target="_blank" rel="noopener noreferrer" href="https://blog.google/products-and-platforms/products/assistant/our-favorite-10-new-things-coming-smart-displays/">Google — Présentation de l’interface à onglets (2020)</a><br><a target="_blank" rel="noopener noreferrer" href="https://blog.google/products-and-platforms/devices/google-nest/new-nest-hub-soli/">Google — Présentation du Nest Hub de deuxième génération (2021)</a><br><a target="_blank" rel="noopener noreferrer" href="https://support.google.com/googlehome/answer/9137285?hl=fr">Google — Pages, gestes et réglages du Nest Hub</a><br><a target="_blank" rel="noopener noreferrer" href="https://support.google.com/googlehome/answer/9136992?hl=fr">Google — Cadre photo</a><br><a target="_blank" rel="noopener noreferrer" href="https://open-meteo.com/">Open-Meteo — Météo, attribution CC BY 4.0</a><br><a target="_blank" rel="noopener noreferrer" href="https://unsplash.com/">Unsplash — Photographies chargées à distance</a><br><a target="_blank" rel="noopener noreferrer" href="https://developers.google.com/youtube/iframe_api_reference">YouTube — Lecteur officiel et limites d’intégration</a></p><p class="demo-note">Aucun suivi publicitaire ajouté à ce fichier. Les services externes reçoivent les requêtes nécessaires à leurs contenus. Les sonneries originales sont intégrées au fichier ; aucun titre ni aucune pochette de lecture ne sont inventés. La recherche musicale intègre des vidéos YouTube ; la bibliothèque personnelle de YouTube Music reste sur le site officiel. Ce fichier n’intègre pas le compte YouTube de l’utilisateur. Les photographies personnelles restent sur l’appareil.</p>`}

function normalizeNightAndAudio(n,input){

function ytErrorMessage(j,status){const reason=j?.error?.errors?.[0]?.reason||j?.error?.status||'';if(/quota|dailyLimit|rateLimit/i.test(reason))return 'Le quota de ce projet Google est atteint. Réessayez après sa remise à zéro ou vérifiez les quotas dans Google Cloud.';if(/keyInvalid|API_KEY_INVALID/i.test(reason)||status===400&&/key/i.test(j?.error?.message||''))return 'La clé API n’est pas valide. Vérifiez la clé dans les réglages YouTube.';if(/accessNotConfigured|SERVICE_DISABLED/i.test(reason))return 'Activez YouTube Data API v3 dans le même projet Google Cloud que votre clé.';if(status===403)return 'Google refuse la requête. Vérifiez l’activation de YouTube Data API v3 et les restrictions de la clé : API autorisée et adresse de votre site.';if(status===429)return 'Trop de requêtes. Attendez quelques instants avant de relancer.';return 'YouTube n’a pas pu répondre (HTTP '+status+'). Réessayez plus tard.'}

async function ytFetch(endpoint,params,signal){const key=U.ytKey;if(!key)throw Error('Ajoutez votre clé YouTube Data API dans les réglages.');const u='https://www.googleapis.com/youtube/v3/'+endpoint+'?'+new URLSearchParams({...params,key});let response;try{response=await fetch(u,{signal,referrerPolicy:'strict-origin-when-cross-origin',credentials:'omit'})}catch(e){if(e.name==='AbortError')throw e;throw Error('Connexion à YouTube impossible. Vérifiez le réseau et les bloqueurs de contenu pour ce site.')}let j;try{j=await response.json()}catch(_){throw Error('YouTube a renvoyé une réponse illisible.')}if(!response.ok||j.error)throw Error(ytErrorMessage(j,response.status));return j}

function ytCount(){const today=localDay();if(S.final.youtube.usage?.date!==today)S.final.youtube.usage={date:today,count:0};S.final.youtube.usage.count++;save()}

function ytOpen(v){if(!validVideo(v))return;hideKeyboard();suspendYouTube();if(U.details.at(-1)?.id==='player'){const item=U.details.at(-1);item.data=ytCleanVideo(v);refreshDetail()}else openView('player',ytCleanVideo(v))}

function ytPlayerTools(v){const f=ytBookmarked('favorites',v.id),l=ytBookmarked('later',v.id);return `${btn(f?'En favori':'Favori','ytFavorite',v.id,'heart','pill '+(f?'active':''))}${btn(l?'Dans votre liste':'À regarder','ytLater',v.id,l?'check':'clock','pill')}${btn('Vidéo suivante','ytNext','','next','pill')}`}

function ytUpdatePlayerTools(){const n=U.details.at(-1);if(n?.id==='player'){const a=n.node.querySelector('#yt7-player-actions');if(a)a.innerHTML=ytPlayerTools(n.data)}}

function ytResumeValue(id){const p=S.final.youtube.progress?.[id];return p&&Date.now()-p.at<29*86400000&&p.seconds>5?p.seconds:0}

function ytSaveProgress(){if(!Y7.ready||!Y7.video)return;try{const time=Y7.player.getCurrentTime(),duration=Y7.player.getDuration();if(Number.isFinite(time)&&time>0){S.final.youtube.progress[Y7.video.id]={seconds:duration&&time>duration-8?0:time,at:Date.now()};const ids=Object.keys(S.final.youtube.progress).sort((a,b)=>S.final.youtube.progress[b].at-S.final.youtube.progress[a].at);ids.slice(50).forEach(id=>delete S.final.youtube.progress[id]);save()}}catch(_){}}

function ytApi(){if(window.YT?.Player)return Promise.resolve(window.YT);if(Y7.loadPromise)return Y7.loadPromise;Y7.loadPromise=new Promise((resolve,reject)=>{const old=window.onYouTubeIframeAPIReady;let timeout;window.onYouTubeIframeAPIReady=()=>{clearTimeout(timeout);if(typeof old==='function')try{old()}catch(_){}resolve(window.YT)};const script=document.createElement('script');script.id='youtube-iframe-sdk';script.src='https://www.youtube.com/iframe_api';script.async=true;script.referrerPolicy='strict-origin-when-cross-origin';script.onerror=()=>{clearTimeout(timeout);script.remove();reject(Error('Le script du lecteur YouTube est bloqué ou indisponible.'))};timeout=setTimeout(()=>reject(Error('Le lecteur YouTube n’a pas répondu.')),14000);document.head.append(script)}).catch(e=>{Y7.loadPromise=null;throw e});return Y7.loadPromise}

function ytMessage(text,error=false){const top=U.details.at(-1);if(top?.id!=='player')return;const el=top.node.querySelector('#yt7-message');if(el){el.textContent=text;el.classList.toggle('error',error)}}

function mountYouTube(item){
 clearTimeout(Y7.mountTimer);const token=++Y7.token;Y7.video=item.data;Y7.ready=false;Y7.lastError=null;
 const stage=item.node.querySelector('#yt7-stage');if(!stage||!validVideo(item.data))return;
 if(!['http:','https:'].includes(location.protocol)){stage.innerHTML=`<div class="yt7-player-placeholder">${ytLogo()}<h3>Ouvrez l’adresse de votre site</h3><p>Le lecteur a besoin de l’origine de la page. Un fichier ouvert depuis Fichiers ne fournit pas toujours cette information.</p>${btn('Comprendre','view','diagnostics','info','pill')}</div>`;ytMessage('Ouvrez votre adresse HTTPS Cloudflare dans Safari, pas le fichier téléchargé.',true);return}
 Y7.mountTimer=setTimeout(async()=>{
  if(token!==Y7.token||U.details.at(-1)!==item||U.saver||document.hidden)return;
  const frame=document.createElement('iframe');frame.id='yt7-native-'+token;frame.title='Lecteur vidéo YouTube officiel';frame.referrerPolicy='strict-origin-when-cross-origin';frame.setAttribute('referrerpolicy','strict-origin-when-cross-origin');frame.allow='autoplay; encrypted-media; fullscreen; picture-in-picture';frame.allowFullscreen=true;frame.setAttribute('frameborder','0');
  const params=new URLSearchParams({enablejsapi:'1',playsinline:'1',controls:'1',autoplay:'1',fs:'1',rel:'0',origin:location.origin,hl:'fr'});const start=ytResumeValue(item.data.id);if(start)params.set('start',String(Math.floor(start)));
  frame.src='https://www.youtube.com/embed/'+item.data.id+'?'+params.toString();stage.replaceChildren(frame);document.documentElement.dataset.ytVisible='true';
  try{const yt=await ytApi();if(token!==Y7.token||!frame.isConnected||U.details.at(-1)!==item)return;
   Y7.player=new yt.Player(frame.id,{events:{onReady:ev=>{if(token!==Y7.token)return;Y7.ready=true;Y7.lastError=null;write('#yt7-state','Lecteur prêt');ytMessage('Le son et le plein écran se règlent dans le lecteur YouTube ou sur l’iPad.');clearInterval(Y7.progressTimer);Y7.progressTimer=setInterval(ytSaveProgress,10000)},onStateChange:ev=>{if(token!==Y7.token)return;Y7.state=ev.data;const labels={'-1':'Aucune lecture','0':'Lecture terminée','1':'En lecture','2':'En pause','3':'Chargement…','5':'Prêt à lire'};write('#yt7-state',labels[String(ev.data)]||'YouTube');if(ev.data===1){const v=ytCleanVideo(item.data);Y7.nowVideo=v;if(S.final.youtube.rememberHistory){S.final.youtube.history=[v,...S.final.youtube.history.filter(x=>x.id!==v.id)].slice(0,40);save()}$('#personal-audio')?.pause();stopRelax();requestWake();ytMessage('Lecture dans votre interface. Les commandes officielles restent accessibles.')}if(ev.data===0||ev.data===2)ytSaveProgress()},onError:ev=>{if(token!==Y7.token)return;Y7.lastError=Number(ev.data);write('#yt7-state','Lecture indisponible');const messages={2:'Le lien de cette vidéo est invalide.',5:'Ce navigateur ne peut pas lire cette vidéo HTML5.',100:'Cette vidéo a été supprimée, est privée ou n’est plus disponible.',101:'Le propriétaire de cette vidéo interdit sa lecture intégrée.',150:'Le propriétaire de cette vidéo interdit sa lecture intégrée.',153:'YouTube ne reçoit pas l’identification du site (erreur 153). Ouvrez votre vraie adresse HTTPS dans Safari. Dans Diagnostic, vérifiez le référent et les extensions : la clé de recherche ne corrige pas cette erreur.'};ytMessage(messages[ev.data]||'YouTube signale l’erreur '+ev.data+'. Consultez le diagnostic ou essayez une autre vidéo.',true)},onAutoplayBlocked:()=>{if(token!==Y7.token)return;write('#yt7-state','Touchez Lecture');ytMessage('Safari attend votre appui : touchez le bouton Lecture dans la vidéo.')}}});
  }catch(e){if(token===Y7.token)ytMessage('Le lecteur est affiché, mais ses événements ne sont pas disponibles. '+e.message,true)}
 },S.prefs.reduced?0:400);
}

function dockYouTube(){
 const stage=U.details.at(-1)?.node.querySelector('#yt7-stage');
 const dock=document.getElementById('yt-mini-dock');
 if(!stage||!dock||!Y7.video)return;
 dock.appendChild(stage);dock.classList.add('active');
 document.getElementById('yt-mini-title').textContent=Y7.video.title||'YouTube';
 Y7.docked=true;
}
function restoreDockedYouTube(){
 const dock=document.getElementById('yt-mini-dock');
 if(!Y7.docked||!dock)return;
 const video=Y7.video;
 dock.classList.remove('active');Y7.docked=false;
 // Return to the selected video; the player is restarted from its saved position.
 ytSaveProgress();suspendYouTube();
 if(video)openView('player',video);
}

function suspendYouTube(){Y7.docked=false;document.getElementById('yt-mini-dock')?.classList.remove('active');document.getElementById('yt-mini-dock')?.querySelector('#yt7-stage')?.remove();clearTimeout(Y7.mountTimer);Y7.token++;ytSaveProgress();clearInterval(Y7.progressTimer);try{Y7.player?.pauseVideo?.();Y7.player?.destroy?.()}catch(_){}Y7.player=null;Y7.ready=false;delete document.documentElement.dataset.ytVisible;for(const item of U.details){if(item.id!=='player')continue;const stage=item.node.querySelector('#yt7-stage');if(stage)stage.innerHTML=`<div class="yt7-player-placeholder">${ytLogo()}<h3>Lecture interrompue</h3><p>La vidéo ne joue pas derrière un autre écran.</p>${btn('Reprendre la vidéo','ytResume','','play','pill primary')}</div>`}Y7.state=2}

function ytNext(){const v=Y7.video;if(!v)return;const lane=Y7.lanes[v.kind==='music'?'music':'youtube'],arr=lane.results.length?lane.results:S.final.youtube.later,i=arr.findIndex(x=>x.id===v.id);if(i>=0&&arr[i+1])ytOpen(arr[i+1]);else if(arr.length&&i<0)ytOpen(arr[0]);else toast('Aucune autre vidéo dans cette liste. Revenez à vos résultats.')}

function ytLibraryHTML(){const tab=['favorites','later','history'].includes(Y7.libraryTab)?Y7.libraryTab:'favorites',items=S.final.youtube[tab];return `<div class="yt7-library-nav">${[['favorites','Favoris','heart'],['later','À regarder','clock'],['history','Vues ici','play']].map(([id,title,icon])=>btn(title,'ytLibraryTab',id,icon,'pill '+(tab===id?'active':''))).join('')}${btn('Rechercher','view','youtube','search','pill primary')}</div><p class="demo-note mb">Votre bibliothèque locale. Ces listes ne modifient ni vos favoris ni votre historique sur votre compte Google.</p>${items.length?`<div class="yt7-grid">${items.map(ytCardHTML).join('')}</div><div class="mt">${btn('Vider cette liste','ytClearList',tab,'trash','text-btn')}</div>`:`<div class="yt7-empty"><div class="yt7-empty-icon">${ic(tab==='favorites'?'heart':tab==='later'?'clock':'play')}</div><h2>${tab==='history'?'Aucune vidéo lue ici':'Votre liste attend ses premières vidéos'}</h2><p>${tab==='history'?'Les vidéos apparaissent après le début effectif de la lecture.':'Utilisez les boutons sous les résultats YouTube pour enregistrer une vidéo.'}</p></div>`}`}

async function ytSaveKey(form){const f=new FormData(form),candidate=String(f.get('key')||'').trim(),remember=f.has('remember');if(candidate&&!/^AIza[A-Za-z0-9_-]{20,100}$/.test(candidate)){Y7.keyStatus='Le format ne correspond pas à une clé Google API. Copiez uniquement la clé.';refreshDetail();return}if(candidate)U.ytKey=candidate;if(!U.ytKey){Y7.keyStatus='Collez votre clé avant d’enregistrer.';refreshDetail();return}Y7.persist=remember;try{sessionStorage.setItem(YT_SESSION_STORE,U.ytKey);if(remember)localStorage.setItem(YT_KEY_STORE,U.ytKey);else localStorage.removeItem(YT_KEY_STORE);Y7.keyStatus=remember?'Clé enregistrée sur cet iPad. Testez maintenant son accès.':'Clé conservée dans cet onglet. Testez maintenant son accès.'}catch(_){Y7.persist=false;Y7.keyStatus='Le stockage est bloqué : la clé reste en mémoire pour cette ouverture.'}Y7.cache.clear();for(const r of Object.values(Y7.lanes))r.error='';refreshDetail();toast('Clé enregistrée.');}

async function ytTestKey(){if(Y7.keyBusy)return;const candidate=U.details.at(-1)?.node.querySelector('#yt-key')?.value.trim();if(candidate){await ytSaveKey(U.details.at(-1).node.querySelector('#yt-key-form'))}if(!U.ytKey){Y7.keyStatus='Ajoutez une clé avant le test.';refreshDetail();return}Y7.keyBusy=true;Y7.keyStatus='Test auprès de Google…';refreshDetail();const ctl=new AbortController(),timeout=setTimeout(()=>ctl.abort(),15000);try{await ytFetch('videos',{part:'id',id:'M7lc1UVf-VE'},ctl.signal);Y7.keyStatus='Google accepte cette clé pour YouTube Data API v3. La lecture vidéo se teste séparément.'}catch(e){Y7.keyStatus=e.name==='AbortError'?'Le test a expiré. Vérifiez la connexion.':e.message}finally{clearTimeout(timeout);Y7.keyBusy=false;if(U.details.at(-1)?.id==='youtubeSettings')refreshDetail()}}

function ytClearKey(){U.ytKey='';Y7.persist=false;Y7.keyStatus='Clé supprimée de cette page et de son stockage.';Y7.request++;Y7.controller?.abort();Y7.cache.clear();try{localStorage.removeItem(YT_KEY_STORE);sessionStorage.removeItem(YT_SESSION_STORE)}catch(_){}for(const r of Object.values(Y7.lanes)){r.error='';r.loading=false}if(U.details.at(-1)?.id==='youtubeSettings')refreshDetail();toast('Clé supprimée.')}

function normalizeFinal(n,input){
 const f=input.final&&typeof input.final==='object'?input.final:{},y=f.youtube&&typeof f.youtube==='object'?f.youtube:{};
 const list=k=>(Array.isArray(y[k])?y[k]:[]).map(ytCleanVideo).filter(Boolean).filter((v,i,a)=>a.findIndex(t=>t.id===v.id)===i).slice(0,k==='history'?40:100);
 const progress={};if(y.progress&&typeof y.progress==='object')for(const [id,p] of Object.entries(y.progress).slice(-50)){if(/^[\w-]{11}$/.test(id)&&p&&Number.isFinite(p.seconds)&&Number.isFinite(p.at)&&Date.now()-p.at<29*86400000)progress[id]={seconds:clamp(p.seconds,0,86400),at:p.at}}
 n.final={youtube:{favorites:list('favorites'),later:list('later'),history:list('history'),progress,rememberHistory:y.rememberHistory!==false,usage:{date:typeof y.usage?.date==='string'?y.usage.date:localDay(),count:clamp(y.usage?.count,0,100000)}},focusMinutes:[15,25,45,60,90].includes(Number(f.focusMinutes))?Number(f.focusMinutes):25,
 alerts:(Array.isArray(f.alerts)?f.alerts:[]).filter(a=>a&&typeof a.title==='string').slice(0,40).map(a=>({title:a.title.slice(0,180),at:Number(a.at)||Date.now(),type:['alarm','timer','info'].includes(a.type)?a.type:'info'}))};
 for(const a of n.alarms){const old=(Array.isArray(input.alarms)?input.alarms:[]).find(x=>String(x.id)===a.id)||{};a.sound=Object.prototype.hasOwnProperty.call(ALARM_ASSETS,old.sound)?old.sound:'default';a.snoozeMin=[1,5,10,15].includes(Number(old.snoozeMin))?Number(old.snoozeMin):5}
 n.events=n.events.filter(e=>/^([01]\d|2[0-3]):[0-5]\d$/.test(e.time));
 return n;
}

function diagnosticsHTML(){const d=diagnosticsData();const rows=[['Page',d.origin,d.secure],['Affichage',d.viewport+' pixels CSS · '+(d.standalone?'écran d’accueil':'navigateur'),true],['Réglages locaux',d.localStorage?'Sauvegarde disponible':'Stockage indisponible',d.localStorage],['Photos personnelles',d.photoStorage?d.photos+' photo(s) · stockage disponible':'Stockage photo indisponible',d.photoStorage],['Météo',d.weather==='ok'?'Dernière mise à jour reçue':d.weather==='loading'?'Chargement en cours':'Dernières données ou connexion indisponible',d.weather==='ok'],['Audio',d.audio,d.audio==='running'],['Maintien éveillé',d.wakeLock?'Actif':'Non actif ou non autorisé',d.wakeLock],['Typographie',d.font,true],['Clé YouTube',d.youtubeKey,!!U.ytKey],['Référent de la page',d.referrerPolicy,d.referrerPolicy==='strict-origin-when-cross-origin'],['En-tête du serveur',String(d.serverReferrerPolicy),d.serverReferrerPolicy==='strict-origin-when-cross-origin'],['Dernière erreur du lecteur',d.lastPlayerError?'Erreur '+d.lastPlayerError:'Aucune erreur reçue',!d.lastPlayerError]];return `<div class="row between mb"><h2>État de cet écran</h2><span class="version7">${VERSION}</span></div><div class="diag7-grid">${rows.map(([t,v,ok])=>`<div class="diag7-row"><span class="diag7-dot ${ok?'ok':''}"></span><div><strong>${t}</strong><p>${esc(v)}</p></div></div>`).join('')}</div><div class="pills mt">${btn('Actualiser le diagnostic','diagRefresh','','refresh','pill primary')}${btn('Exporter sans les clés','diagExport','','download','pill')}${btn('Test audio','testSound','','volume','pill')}</div><details class="diagnostic7-help" ${d.lastPlayerError===153?'open':''}><summary>YouTube affiche l’erreur 153 ?</summary><p>YouTube indique que le lecteur ne reçoit pas l’identification du site. Cette version fournit l’origine réelle et <code>referrerpolicy="strict-origin-when-cross-origin"</code>. La clé Data API n’agit pas sur cette erreur.</p><p>Ouvrez l’adresse HTTPS principale de votre site dans Safari, pas l’aperçu d’un fichier ni une page intégrée dans une autre application. Vérifiez les règles Referrer-Policy de votre hébergement et les bloqueurs de contenu pour ce site. Ne désactivez pas globalement les protections de l’iPad.</p><p>Le test du serveur lit seulement l’en-tête de votre propre page ; il ne peut pas certifier les en-têtes que YouTube a reçus. Si nécessaire, le fichier <code>_headers</code> fourni avec le paquet de déploiement fixe la politique pour Cloudflare Pages.</p><a href="https://developers.google.com/youtube/terms/required-minimum-functionality#api-client-identity-and-credentials" target="_blank" rel="noopener">Documentation officielle YouTube ${ic('external','s')}</a></details><details class="diagnostic7-help"><summary>Pourquoi une alarme peut-elle être manquée ?</summary><p>Le navigateur peut suspendre la page quand l’iPad est verrouillé ou quand vous changez d’application. Le maintien éveillé est une demande au navigateur, pas une permission d’exécution en arrière-plan. Gardez une alarme système pour un réveil important.</p></details><p class="demo-note">Ce diagnostic décrit ce que la page observe. Aucun identifiant privé ni aucune clé API ne sont inclus dans le rapport exporté.</p>`}

async function refreshDiagnostics(){if(Y7.diagBusy)return;Y7.diagBusy=true;Y7.diagHeaders='Vérification…';refreshDetail();const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),8000);try{if(!/^https?:$/.test(location.protocol))throw Error();const r=await fetch(location.href,{method:'HEAD',cache:'no-store',signal:ctl.signal});Y7.diagHeaders=r.headers.get('referrer-policy')||'Aucun en-tête serveur déclaré (la balise de la page reste définie).'}catch(_){Y7.diagHeaders='Lecture de l’en-tête impossible.'}finally{clearTimeout(timer);Y7.diagBusy=false;if(U.details.at(-1)?.id==='diagnostics')refreshDetail()}}

function statusPageHTML(){return `<div class="capability7-grid">${[['play','YouTube','Recherche réelle avec votre clé et lecteur officiel. Les restrictions YouTube et le réseau restent applicables.'],['cloud','Météo','Données Open-Meteo, sélection de ville, prévisions horaires et à sept jours. Les valeurs anciennes sont signalées.'],['photo','Cadre photo','28 images en ligne, favoris, import local, diaporama, six styles d’horloge, mode nuit.'],['alarm','Alarmes et outils','Sonneries embarquées, alarmes personnalisées, minuteurs, chronomètre, agenda et listes locaux.'],['home','Maison de démonstration','Les interrupteurs, couleurs, températures et routines modifient uniquement les appareils fictifs de cette interface.'],['micOff','Sans assistant vocal','Aucun microphone. L’assistant, les appels et le suivi du sommeil restent des démonstrations.']].map(([icon,title,desc])=>`<div class="soft-card">${ic(icon,'l')}<h3 class="mt">${title}</h3><p class="muted small mt">${desc}</p></div>`).join('')}</div><p class="notice mt">Cette interface indépendante n’est ni le logiciel d’un Nest Hub ni une application officielle Google. Aucun accès à Google Home ou à Google Photos n’est activé.</p>`}

function finalAction(name,id,el){
 switch(name){
  case 'alarmPreviewSelected':previewAlarmSelected();return true;
  case 'ytPlay':ytOpen(ytFind(id));return true;
  case 'videoResult':{const v=ytLane().results[Number(id)]||U.ytResults[Number(id)];if(v)ytOpen(v);return true}
  case 'ytFavorite':ytToggle('favorites',id);return true;
  case 'ytLater':ytToggle('later',id);return true;
  case 'ytMore':searchYouTube(true);return true;
  case 'ytRetry':searchYouTube(false);return true;
  case 'ytNext':ytNext();return true;
  case 'ytResume':{const top=U.details.at(-1);if(top?.id==='player')mountYouTube(top);return true}
  case 'ytLibraryTab':Y7.libraryTab=id;refreshDetail();return true;
  case 'ytClearList':showModal('Vider cette liste ?', '<p>Cette action ne concerne que les vidéos enregistrées dans cette interface.</p>',btn('Annuler','closeModal','','','pill')+btn('Vider','ytConfirmClear',id,'trash','pill primary'));return true;
  case 'ytConfirmClear':if(['favorites','later','history'].includes(id))S.final.youtube[id]=[];save();closeModal();refreshDetail();return true;
  case 'ytHistoryToggle':S.final.youtube.rememberHistory=!S.final.youtube.rememberHistory;save();refreshDetail();return true;
  case 'ytTestKey':ytTestKey();return true;
  case 'ytKeyClear':ytClearKey();return true;
  case 'focusDuration':if([15,25,45,60,90].includes(Number(id))){S.final.focusMinutes=Number(id);save();refreshDetail()}return true;
  case 'focusStart':startTimer(clamp(Number(id)||25,1,180)*60000,'Concentration');return true;
  case 'breakStart':startTimer(clamp(Number(id)||5,1,60)*60000,'Pause');return true;
  case 'toHome':closeDetails();goTab('today');return true;
  case 'calendarMonth':Y7.month=new Date(Y7.month.getFullYear(),Y7.month.getMonth()+Number(id),1);refreshDetail();return true;
  case 'calendarToday':Y7.month=new Date(new Date().getFullYear(),new Date().getMonth(),1);Y7.selectedDate=localDay();refreshDetail();return true;
  case 'calendarDay':if(/^\d{4}-\d{2}-\d{2}$/.test(id)){Y7.selectedDate=id;refreshDetail()}return true;
  case 'calendarNew':openView('calendarEvent');return true;
  case 'calendarEdit':openView('calendarEvent',id);return true;
  case 'calendarExport':calendarExport();return true;
  case 'diagRefresh':refreshDiagnostics();return true;
  case 'diagExport':downloadBlob(new Blob([JSON.stringify(diagnosticsData(),null,2)],{type:'application/json'}),'diagnostic-nest-hub.json');return true;
  case 'alertsClear':S.final.alerts=[];save();refreshDetail();return true;
  case 'clearSessionCache':Y7.cache.clear();photoCache.clear();photoFailures.clear();toast('Caches de session vidés. Vos photos et réglages sont conservés.');return true;
  case 'photoDeleteOne':{const p=U.customPhotos.find(p=>p.id===id);if(!p)return true;showModal('Supprimer cette copie ?',`<p>${esc(p.name)} sera supprimée uniquement de cette page. Votre fichier original n’est pas modifié.</p>`,btn('Annuler','closeModal','','','pill')+btn('Supprimer','photoConfirmOne',id,'trash','pill danger'));return true}
  case 'photoConfirmOne':{if(db){try{db.transaction('photos','readwrite').objectStore('photos').delete(id)}catch(_){toast('Suppression impossible.');return true}}U.customPhotos=U.customPhotos.filter(p=>p.id!==id);S.prefs.favorites=S.prefs.favorites.filter(v=>v!==id);save();closeModal();refreshDetail();refreshPage();return true}
 }
 return false;
}

function finalSubmit(form){if(form.id==='yt-key-form'){ytSaveKey(form);return true}if(form.id==='calendar7-event-form'){const f=new FormData(form),title=String(f.get('title')||'').trim().slice(0,120),date=String(f.get('date')||''),time=String(f.get('time')||'');if(!title||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time))return true;const id=form.dataset.id||uid('e'),value={id,title,date,time},index=(S.events||[]).findIndex(e=>e.id===id);if(index>=0)S.events[index]=value;else{S.events=S.events||[];if(S.events.length>=200){toast('Limite de 200 événements atteinte.');return true}S.events.push(value)}Y7.selectedDate=date;Y7.month=new Date(Number(date.slice(0,4)),Number(date.slice(5,7))-1,1);save();back();if(U.details.at(-1)?.id==='calendar')refreshDetail();refreshPage();toast('Événement enregistré sur cet iPad.');return true}return false}
